name: build-and-push

# Manual trigger only. Releases are pushed by hand (PUBLISHING.md Part 2.alt)
# until the DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets are set; then add
#   push:
#     tags: ['v*']
# back to publish on every version tag.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            mcb77/movebank-rocker:${{ github.ref_name }}
            mcb77/movebank-rocker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
